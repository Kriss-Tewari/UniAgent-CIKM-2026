name: Upload Task 1 Qwen3 reranking to TIRA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tira-task1-qwen3
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TIRA_CLIENT_TOKEN: ${{ secrets.TIRA_CLIENT_TOKEN }}
      TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install TIRA client
        run: python -m pip install "tira==0.0.205"

      - name: Authenticate and verify TIRA
        run: |
          if [ -z "$TIRA_CLIENT_TOKEN" ]; then
            echo "::error::TIRA_CLIENT_TOKEN is missing."
            exit 1
          fi
          tira-cli login --token "$TIRA_CLIENT_TOKEN"
          tira-cli verify-installation \
            --task uniagent-2026 \
            --team rhineganga

      - name: Build, test, and submit Qwen3 retrieval
        run: |
          tira-cli code-submission \
            --path submissions/Task-1/llm_extended \
            --task uniagent-2026 \
            --tira-vm-id rhineganga \
            --dataset retrieval-de-spot-check-20260816-training \
            --command 'python3 /app/submission.py --dataset "$inputDataset" --output "$outputDir" --reranker qwen3 --model-path /app/models/qwen3-reranker --device cpu --rerank-depth 20'
