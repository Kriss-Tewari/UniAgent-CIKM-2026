name: Upload Task 2 external rq to TIRA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tira-task2-external-rq
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      TIRA_CLIENT_TOKEN: ${{ secrets.TIRA_CLIENT_TOKEN }}
      SUBMISSION_IMAGE: uniagent-policy-external-rq:${{ github.sha }}
      SUBMISSION_DIRECTORY: submissions/solving-policy-v1-rerank-external-qwen3
      TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check TIRA secret
        run: |
          if [ -z "$TIRA_CLIENT_TOKEN" ]; then
            echo "::error::TIRA_CLIENT_TOKEN is missing."
            exit 1
          fi

      - name: Verify packaged files
        run: |
          python - <<'CHECK'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["SUBMISSION_DIRECTORY"])
          checksums = json.loads((root / "package-checksums.json").read_text())
          for name, expected in checksums.items():
              data = (root / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected, name
              if name.endswith(".py"):
                  compile(data, str(root / name), "exec")
          print("Package checksums and Python syntax passed.")
          CHECK

      - name: Install TIRA client
        run: python -m pip install "tira==0.0.205"

      - name: Authenticate and verify TIRA
        run: |
          tira-cli login --token "$TIRA_CLIENT_TOKEN"
          tira-cli verify-installation --task uniagent-2026 --team rhineganga

      - name: Build submission image
        run: |
          docker build --platform linux/amd64 \
            --tag "$SUBMISSION_IMAGE" \
            "$SUBMISSION_DIRECTORY"

      - name: Check installed dependencies
        run: |
          docker run --rm --network none \
            --entrypoint python "$SUBMISSION_IMAGE" -m pip check

      - name: Test indexing and local models without network
        run: |
          docker run --rm --network none \
            --entrypoint python "$SUBMISSION_IMAGE" /app/offline_check.py

      - name: Check fixed prediction command
        run: |
          docker run --rm --network none "$SUBMISSION_IMAGE" --help

      - name: Record container dependencies
        run: |
          docker run --rm --network none \
            --entrypoint python "$SUBMISSION_IMAGE" \
            -m pip freeze > container-dependencies.txt

      - name: Upload and register with TIRA
        run: python ci/upload_policy_external.py

      - name: Save registration and dependency records
        uses: actions/upload-artifact@v4
        with:
          name: task2-external-rq-registration
          path: |
            tira-registration.json
            container-dependencies.txt
