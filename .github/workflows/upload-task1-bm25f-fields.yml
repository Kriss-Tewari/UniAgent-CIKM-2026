name: Upload Task 1 BM25F fields to TIRA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tira-task1-bm25f-fields
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TIRA_CLIENT_TOKEN: ${{ secrets.TIRA_CLIENT_TOKEN }}
      TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install TIRA client
        run: python -m pip install "tira==0.0.205"

      - name: Authenticate and verify TIRA
        run: |
          if [ -z "$TIRA_CLIENT_TOKEN" ]; then
            echo "::error::TIRA_CLIENT_TOKEN is missing."
            exit 1
          fi
          tira-cli login --token "$TIRA_CLIENT_TOKEN"
          tira-cli verify-installation --task uniagent-2026 --team rhineganga

      - name: Build, test retrieval, and submit Task 1
        run: |
          tira-cli code-submission \
            --path submissions/Task-1/retrieval-bm25f-fields \
            --task uniagent-2026 \
            --tira-vm-id rhineganga \
            --dataset retrieval-de-spot-check-20260816-training \
            --command 'python3 /app/bm25f_fields.py --dataset $inputDataset --output $outputDir'
